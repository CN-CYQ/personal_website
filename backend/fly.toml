app = "personal-website-api"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_CORS_ALLOWED_ORIGINS = "https://personal-website-691.pages.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"